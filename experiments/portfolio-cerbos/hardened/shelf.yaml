apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: shelf
  rules:
    - actions: ["read"]
      effect: EFFECT_ALLOW
      roles: ["reader"]
      condition:
        match:
          expr: request.resource.attr.shelf == request.principal.attr.shelf
    - actions: ["read"]
      effect: EFFECT_DENY
      roles: ["*"]
      condition:
        match:
          expr: request.principal.attr.suspended == true
